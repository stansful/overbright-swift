name: Release

# Releases Overbright from main. Every push to main runs the whole CI first (ci.yml through workflow_call; ci.yml skips
# its own run of that push, so the checks run once). When the version in VERSION has no release yet,
# scripts/build-release.sh (what a local release build runs) builds Overbright-<version>.zip, .dmg and .sha256 on the
# macOS runner, and they are published as GitHub release "Overbright <version>" with the tag v<version> on the built
# commit: a draft first, every upload checked, then published as the latest release, which the update check reads
# (/releases/latest). A push that does not bump the version is tested and ends with a notice. Bump it with
# scripts/make-release.sh, which commits "feat: release - version X.Y.Z". Nothing is built or published from a commit
# whose checks fail: re-run the failed jobs, or push a fix (the version is still unreleased).
#
# Signing: with the repository secrets DEVELOPER_ID_P12_BASE64 (the Developer ID Application certificate and its key,
# a .p12 in base64), NOTARY_KEY_P8_BASE64 (an App Store Connect API key, the .p8 in base64), NOTARY_KEY_ID and
# NOTARY_ISSUER_ID, and DEVELOPER_ID_P12_PASSWORD when the .p12 has a password, the app is signed with Developer ID and
# notarized; with none of them it is ad-hoc signed and users allow it once with "Open Anyway". Once a release is
# signed with Developer ID, a build signed any other way is never published.
#
# Jobs:
#   gate     reads the version and its release state (.github/scripts/release-state.sh).
#   quality  the whole CI (ci.yml) on every push to main, released or not.
#   build    scripts/build-release.sh with the signing secrets, checked against the latest release. No write token.
#   publish  creates the release: draft -> upload and check the assets -> publish (GitHub creates the tag).
#
# workflow_dispatch with dry_run builds any branch the same way (signed, checked against the latest release's signing)
# and publishes nothing.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only: no tag, no release"
        type: boolean
        default: false

permissions: {}

concurrency:
  # Releases from main queue up and are never cancelled half-way. Dry runs and manual runs of other branches (which the
  # gate refuses) get a group of their own, so they never cancel a pending release.
  group: ${{ (inputs.dry_run || github.ref != 'refs/heads/main') && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gate:
    name: Decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /VERSION
            /scripts/lib/version.sh
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Read the version and its release state
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/lib/version.sh
          if ! version="$(app_version_get .)"; then
            echo "::error file=VERSION::VERSION must hold the version alone, one line X.Y.Z."
            exit 1
          fi
          tag="$(release_tag "$version")"

          if [[ "$DRY_RUN" == "true" ]]; then
            # Any branch and any version: build and check, never publish. The state is only reported.
            state="$(bash .github/scripts/release-state.sh)" || state="not releasable"
            build=true
            publish=false
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Releases are published only from main. Use dry_run to build another branch."
              exit 1
            fi
            state="$(bash .github/scripts/release-state.sh)"
            case $state in
              released)
                build=false
                publish=false
                echo "::notice title=Nothing to release::Version ${version} is already released (${tag}). Bump it with scripts/make-release.sh (commit \"feat: release - version X.Y.Z\") and push to release."
                ;;
              retry)
                build=true
                publish=true
                echo "::notice::Tag ${tag} is already on this commit without a release: publishing it."
                ;;
              new)
                build=true
                publish=true
                ;;
              *)
                echo "::error::release-state.sh printed '${state}'."
                exit 1
                ;;
            esac
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version ($state): build $build, publish $publish"

  # Every push to main, released or not, gets the whole CI here (ci.yml itself ignores pushes to main). It runs even
  # when the gate refused the version, so the push is still tested.
  quality:
    name: CI
    needs: gate
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release: true

  build:
    name: Build the release
    needs: [gate, quality]
    if: needs.gate.outputs.build == 'true'
    # The image of ci.yml's build job: the app needs Xcode 27 (ARCHITECTURE.md §8.9)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      # All four secrets (and the .p12's password, when it has one): Developer ID signing and notarization; none:
      # ad-hoc signing. Anything between is an error, so a missing secret never turns a signed release into an ad-hoc
      # one unnoticed; a missing password fails the import.
      - name: Signing (Developer ID from the secrets, or ad-hoc)
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          count=0
          for name in P12_BASE64 NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -z "${!name}" ]] || count=$((count + 1))
          done
          # the password alone is a half configuration too, not "no secrets"
          if [[ $count -eq 0 && -z "$P12_PASSWORD" ]]; then
            echo "::notice title=Ad-hoc signed::No Developer ID secrets: the app is ad-hoc signed, and users allow it once with Open Anyway."
            exit 0
          fi
          if [[ $count -ne 4 ]]; then
            echo "::error title=Signing is half configured::Set all four secrets DEVELOPER_ID_P12_BASE64, NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID and NOTARY_ISSUER_ID (and DEVELOPER_ID_P12_PASSWORD when the .p12 has a password), or none of them."
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$KEYCHAIN" > /dev/null
          # codesign finds the identity only in the search list: the new keychain first, the user's after it
          keychains=("$KEYCHAIN")
          while IFS= read -r keychain; do
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -z "$keychain" || "$keychain" == "$KEYCHAIN" ]] || keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            awk -F'"' '/Developer ID Application/ && id == "" { id = $2 } END { print id }')"
          team="$(sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/' <<< "$identity")"
          if [[ -z "$identity" || ! "$team" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 holds no Developer ID Application identity: '${identity}'."
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials overbright-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "TEAM_ID=$team"
            echo "NOTARY_PROFILE=overbright-notary"
            echo "NOTARY_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
          echo "Signing with $identity, notarized"

      # The release's own build: the update check asks this repository, CFBundleVersion is the run number
      - name: Build the release (scripts/build-release.sh)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          OVERBRIGHT_GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/build-release.sh --out "$RUNNER_TEMP/out"

      - name: Check the release files
        run: |
          . scripts/lib/version.sh
          if [[ "$(app_version_get .)" != "$VERSION" ]]; then
            echo "::error file=VERSION::VERSION is not $VERSION."
            exit 1
          fi
          expected="$(release_assets "$VERSION" | LC_ALL=C sort)"
          actual="$(find "$RUNNER_TEMP/out" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::The build holds ${actual//$'\n'/ }, not ${expected//$'\n'/ }."
            exit 1
          fi
          (cd "$RUNNER_TEMP/out" && shasum -a 256 -c "Overbright-$VERSION.sha256")

      # macOS takes an app signed by another team, or ad-hoc, for another app than the Developer ID one users have:
      # Gatekeeper asks again and the login item's approval does not carry over. A Developer ID release is followed by
      # releases of the same team only (ad-hoc to Developer ID is fine).
      - name: Check the signing against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TeamIdentifier: a team ID, or "not set" when ad-hoc signed; nothing when codesign cannot read it
          team_of() {
            codesign -dv "$1" 2>&1 | sed -n 's/^TeamIdentifier=//p' || true
          }
          if ! latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.err")"; then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
              echo "No published release yet: nothing to compare the signing with."
              exit 0
            fi
            cat "$RUNNER_TEMP/latest.err" >&2
            echo "::error::Cannot read the latest release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/latest"
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern 'Overbright-*.zip' --dir "$RUNNER_TEMP/latest"
          zips=("$RUNNER_TEMP"/latest/Overbright-*.zip)
          if [[ ${#zips[@]} -ne 1 || ! -f "${zips[0]}" ]]; then
            echo "::error::Release $latest has no single Overbright-*.zip to compare the signing with."
            exit 1
          fi
          ditto -x -k "${zips[0]}" "$RUNNER_TEMP/latest/app"
          expected="$(team_of "$RUNNER_TEMP/latest/app/Overbright.app")"
          actual="$(team_of build/Overbright.app)"
          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "::error::Cannot read the signing team of release $latest ('$expected') or of this build ('$actual')."
            exit 1
          fi
          if [[ "$expected" != "not set" && "$actual" != "$expected" ]]; then
            echo "::error title=Wrong signing::Release $latest is signed by team $expected, this build by '$actual'. Sign with team $expected's Developer ID (the repository secrets)."
            exit 1
          fi
          echo "This build: team $actual; release $latest: team $expected"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: ${{ needs.gate.outputs.publish == 'true' && 7 || 1 }}
          compression-level: 0

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing material
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [[ -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"

  # A separate job, so the write token never shares a machine with the build, and a failed upload can be re-run without
  # rebuilding.
  publish:
    name: Publish the release
    needs: [gate, quality, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags for the notes, without the tree.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /VERSION
            /scripts/lib/version.sh
            /.github/scripts/
          sparse-checkout-cone-mode: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.VERSION }}
          path: ${{ runner.temp }}/release-assets

      # The commit subjects since the previous release tag
      - name: Write the release notes
        run: |
          bash .github/scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish ${{ needs.gate.outputs.version }}
        run: |
          . scripts/lib/version.sh
          # exported: the draft lookup below reads it as jq's env.TAG
          TAG="$(release_tag "$VERSION")"
          export TAG
          # Fresh state, not the gate's: this job may be a re-run days later.
          state="$(bash .github/scripts/release-state.sh)"
          if [[ "$state" == released ]]; then
            # A re-run after GitHub applied the publish but answered it with an error: the release went live from this
            # very commit.
            if [[ "$(git ls-remote --tags origin | tag_commit "$TAG")" == "$GITHUB_SHA" ]]; then
              echo "::notice::${TAG} is already published from this commit."
              exit 0
            fi
            echo "::error::${TAG} has already been released from another commit."
            exit 1
          fi
          # A re-run of an old run must not release a commit that main has already moved past. That newer run releases
          # the version instead (GITHUB_TOKEN could not tag this commit anyway once the workflows differ).
          tip="$(git ls-remote origin refs/heads/main | cut -f 1)"
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "::warning title=Not published::main moved to ${tip}; the run for that commit releases ${VERSION}. Re-run it if it was cancelled."
            exit 0
          fi

          assets=()
          while IFS= read -r name; do
            assets+=("$RUNNER_TEMP/release-assets/$name")
          done < <(release_assets "$VERSION")
          for f in "${assets[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "::error::The build outputs lack $(basename "$f")."
              exit 1
            fi
          done

          # A run interrupted before publishing leaves a draft. Remove our own, never one a person made.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | "\(.id) \(.author.login)"' \
            | while read -r release_id author; do
                if [[ "$author" != "github-actions[bot]" ]]; then
                  echo "::error::Draft release ${TAG} by ${author} already exists. Publish or delete it, then re-run."
                  exit 1
                fi
                gh api --method DELETE "repos/$GH_REPO/releases/$release_id" --silent
              done

          # 1) A draft: invisible to /releases/latest, which the update check reads. GitHub creates the tag on
          #    publish. The API returns the draft's id at once; everything below works with that id, never with a
          #    lookup in the release list, which lags behind.
          id="$(gh api --method POST "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Overbright $VERSION" -F body=@"$RUNNER_TEMP/release-notes.md" \
            -F draft=true --jq .id)"
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Creating the draft for ${TAG} returned no release id: ${id}"
            exit 1
          fi
          # A failed step removes the draft, but never a release that went live: GitHub may apply the PATCH below and
          # still answer it with an error, so once the PATCH was sent only a release that is still a draft goes. A
          # re-run then finds the release published from this commit.
          trap 'if [[ -z "${published:-}" ]] && { [[ -z "${patching:-}" ]] || [[ "$(gh api "repos/$GH_REPO/releases/$id" --jq .draft 2>/dev/null)" == true ]]; }; then gh api --method DELETE "repos/$GH_REPO/releases/$id" --silent || true; fi' EXIT

          # 2) Every asset, then the draft's asset list against the built files: name, size and digest
          for f in "${assets[@]}"; do
            curl -fsS --max-time 300 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@$f" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
          uploaded="$RUNNER_TEMP/uploaded.txt"
          for _ in 1 2 3 4 5 6; do
            gh api "repos/$GH_REPO/releases/$id" \
              --jq '.assets[] | "\(.name) \(.size) \(.state) \(.digest // "-")"' > "$uploaded"
            [[ "$(wc -l < "$uploaded")" -ne "${#assets[@]}" ]] || break
            sleep 5
          done
          if [[ "$(wc -l < "$uploaded")" -ne "${#assets[@]}" ]]; then
            echo "::error::The draft has $(wc -l < "$uploaded") assets instead of ${#assets[@]}."
            exit 1
          fi
          for f in "${assets[@]}"; do
            name="$(basename "$f")"
            size="" asset_state="" digest=""
            read -r _ size asset_state digest < <(awk -v n="$name" '$1 == n' "$uploaded") || true
            if [[ "$size" != "$(wc -c < "$f" | tr -d ' ')" || "$asset_state" != uploaded ]]; then
              echo "::error::${name} on the draft does not match the built file (size ${size:-?}, state ${asset_state:-?})."
              exit 1
            fi
            if [[ "$digest" == "-" ]]; then
              echo "::warning::GitHub reported no digest for ${name}."
            elif [[ "$digest" != "sha256:$(sha256sum "$f" | cut -d ' ' -f 1)" ]]; then
              echo "::error::${name} on the draft has digest ${digest}, which differs from the built file."
              exit 1
            fi
          done

          # 3) Publish as the latest release
          patching=1
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true --silent
          published=1

          latest=""
          for _ in 1 2 3 4 5 6; do
            latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name || true)"
            [[ "$latest" == "$TAG" ]] && break
            sleep 5
          done
          if [[ "$latest" != "$TAG" ]]; then
            echo "::error::/releases/latest returns \"${latest}\", not ${TAG}."
            exit 1
          fi
          # The tag GitHub created on publish, an annotated one followed to its commit
          tag_sha="$(git ls-remote --tags origin | tag_commit "$TAG")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${TAG} points at ${tag_sha:-nothing}, not ${GITHUB_SHA}."
            exit 1
          fi
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG"
