name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode-27 image (arm64, macOS 27). The app needs Xcode 27: the App Intents declarations in App/Intents use
    # `allowedExecutionTargets`, which only the macOS 27 SDK has (ARCHITECTURE.md §8.9). CI runners are VMs with
    # virtual displays: no test needs a real display, and smoke passes with `displays: []`.
    # The runner labels and the @v7 actions are carried over from Cranny, whose CI never ran: confirm them on the
    # first push.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Lint (copy rules per language, the clean-room denylist over catalogs and every repository file, no Metal shader sources, script self-tests)
        run: make lint

      - name: Shipped languages are complete and valid (placeholders, plural forms, quotes; new keys may be pending)
        run: /usr/bin/python3 -I scripts/l10n/validate.py --shipped

      - name: Every OverbrightKit module builds on its own (zero warnings) + unit tests
        run: JOBS=3 TEST=1 scripts/check-modules.sh

      - name: Thread Sanitizer (hang watchdog, background-queue writers)
        run: make tsan FILTER=HangWatchdogTests

      - name: SDK name-collision probes are up to date
        run: CHECK=1 scripts/name-probe.sh

      - name: String Catalogs are in sync with code
        run: CHECK=1 scripts/sync-strings.sh

      - name: Compile check with the dormant Control Center extension (CONTROLS=1)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: CONTROLS=1 scripts/build.sh

      - name: Release build (universal arm64 + x86_64, ad-hoc signed, extension removed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build.sh

      - name: Launch smoke test (--diagnostics only, read-only, no UI; App Intents metadata)
        run: scripts/smoke.sh

      - name: Package zip + dmg
        run: scripts/dist.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Overbright-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-${{ github.sha }}
          path: build/logs/

  package-macos-26:
    # Minimum-toolchain job (ARCHITECTURE.md §8.9): the `macos-26` image with its default Xcode 26.x (Swift 6.2) builds
    # and tests the package only. The app's intent declarations need Xcode 27's SDK, so no app build here. It has not
    # run on GitHub yet: until its first green run it reports without failing the workflow; then remove
    # `continue-on-error`.
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: Packages/OverbrightKit
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Build OverbrightKit (zero warnings)
        run: swift build --scratch-path .build -Xswiftc -warnings-as-errors

      - name: Test OverbrightKit
        run: swift test --scratch-path .build-test
